name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar la librería y dependencias de test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" scikit-learn
      - name: Ejecutar tests (incluye doctests)
        run: pytest -v

  dataset-contract:
    # Comprueba que el CSV del repo cumple el contrato de datos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_dataset.py data/dataset.csv
